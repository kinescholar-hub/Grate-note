<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Native App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GreatNotes">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    
    <title>GreatNotes - Ultimate Edition</title>
    
    <!-- Tailwind CSS with Absolute Premium Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'] },
                    colors: {
                        ios: {
                            blue: '#007AFF', darkBlue: '#0A84FF',
                            bg: '#F2F2F7', darkBg: '#000000',
                            text: '#1C1C1E', darkText: '#FFFFFF',
                            subtext: '#8E8E93', darkSubtext: '#98989D',
                            canvas: '#E5E5EA', darkCanvas: '#09090B'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px rgba(0, 0, 0, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.8)',
                        'glass-dark': '0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.15)',
                        'page': '0 0 0 1px rgba(0,0,0,0.02), 0 8px 24px -4px rgba(0,0,0,0.08), 0 24px 48px -12px rgba(0,0,0,0.15)',
                        'page-dark': '0 0 0 1px rgba(255,255,255,0.1), 0 8px 24px -4px rgba(0,0,0,0.5), 0 32px 64px -12px rgba(0,0,0,0.9)'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons for Native Feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Core PDF Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* Base Native iPad Behaviors */
        :root { -webkit-tap-highlight-color: transparent; }
        body { 
            overscroll-behavior-y: none; 
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            background-color: #F2F2F7;
            background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark body { 
            background-color: #000000; 
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* * ==========================================
         * VISION-OS / iOS 18 PREMIUM GLASS 
         * ========================================== */
        .liquid-glass {
            background: rgba(250, 250, 250, 0.65);
            backdrop-filter: blur(50px) saturate(250%);
            -webkit-backdrop-filter: blur(50px) saturate(250%);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.7), 
                        inset 0 1px 2px rgba(255,255,255,0.9);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .dark .liquid-glass {
            background: rgba(30, 30, 30, 0.55);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
                        inset 0 1px 2px rgba(255,255,255,0.1);
        }

        .liquid-glass-heavy {
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: blur(60px) saturate(200%);
            -webkit-backdrop-filter: blur(60px) saturate(200%);
        }
        .dark .liquid-glass-heavy {
            background: rgba(28, 28, 30, 0.85);
        }

        /* * ==========================================
         * BUTTER-SMOOTH ANIMATIONS & PHYSICS
         * ========================================== */
        .spring-btn { 
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), 
                        background-color 0.3s ease,
                        box-shadow 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.3s ease, filter 0.3s ease;
            transform-origin: center;
        }
        
        .spring-btn:active:not(:disabled) { 
            transform: scale(0.92); 
            transition: transform 0.1s cubic-bezier(0.22, 1, 0.36, 1), 
                        box-shadow 0.1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .liquid-glass.spring-btn:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.8); 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        }
        .dark .liquid-glass.spring-btn:active:not(:disabled) {
            background: rgba(50, 50, 50, 0.65);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        /* View Spatial Transitions */
        .spatial-transition {
            transition: transform 0.65s cubic-bezier(0.32, 0.72, 0, 1),
                        filter 0.65s cubic-bezier(0.32, 0.72, 0, 1),
                        opacity 0.65s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform, filter, opacity;
        }

        /* 3D Volumetric Books with Spines */
        .book-cover { 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease; 
            transform-style: preserve-3d;
        }
        .group:active .book-cover {
            transform: scale(0.95) perspective(1200px) rotateX(3deg) translateY(2px) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
            transition: all 0.15s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .book-spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
            background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 20%, rgba(0,0,0,0.1) 40%, rgba(255,255,255,0.1) 80%, rgba(0,0,0,0.2) 100%);
            border-right: 1px solid rgba(0,0,0,0.1);
            mix-blend-mode: overlay; z-index: 10; pointer-events: none;
        }

        /* PencilKit Active Tool Styling */
        .tool-btn { position: relative; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .tool-btn.active { transform: translateY(-6px); }
        .tool-btn::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%) scale(0);
            width: 5px; height: 5px; border-radius: 50%; background-color: currentColor;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tool-btn.active::after { transform: translateX(-50%) scale(1); }

        /* Overlays & Modals */
        .overlay { display: none; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); z-index: 1000; }
        .overlay.active { display: flex; }

        /* Workspace Scrollbar */
        #canvas-viewport { scroll-behavior: smooth; touch-action: pan-x pan-y; }
        
        .page-wrapper { transform: translateZ(0); will-change: contents; transition: width 0.3s ease, height 0.3s ease; }
        
        /* STRICT HARDWARE ACCELERATION & PALM REJECTION */
        .ink-layer { 
            mix-blend-mode: multiply; 
            touch-action: none !important; /* Critical for native iPadOS palm rejection */
            -webkit-user-drag: none;
        }
        .dark .ink-layer { mix-blend-mode: normal; } 
    </style>
</head>
<body class="overflow-hidden text-ios-text dark:text-ios-darkText antialiased w-full h-full flex font-sans">

    <!-- GLOBAL LOADING OVERLAY -->
    <div id="loading-overlay" class="overlay fixed inset-0 bg-white/50 dark:bg-black/70 flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-400">
        <div class="liquid-glass p-10 rounded-[36px] flex flex-col items-center transform transition-transform duration-500 scale-90" id="loading-content">
            <div class="relative w-20 h-20 mb-6 flex items-center justify-center">
                <div class="absolute inset-0 border-[6px] border-ios-blue/10 dark:border-ios-darkBlue/20 rounded-full"></div>
                <div class="absolute inset-0 border-[6px] border-t-ios-blue dark:border-t-ios-darkBlue rounded-full animate-spin" style="animation-duration: 0.8s;"></div>
                <i data-lucide="file-text" class="w-8 h-8 text-ios-blue absolute"></i>
            </div>
            <p class="text-[22px] font-extrabold tracking-tight" id="loading-text">Processing Document</p>
            <p class="text-[15px] font-semibold text-ios-subtext mt-2" id="loading-subtext">Optimizing pages...</p>
        </div>
    </div>

    <!-- GLOBAL NATIVE MODAL -->
    <div id="custom-modal" class="overlay fixed inset-0 bg-black/30 dark:bg-black/80 items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="liquid-glass rounded-[32px] w-[360px] overflow-hidden transform scale-90 transition-transform duration-500 ease-spring" id="custom-modal-content">
            <div class="p-8 text-center">
                <h3 class="text-[22px] font-extrabold mb-3 tracking-tight text-ios-text dark:text-white" id="modal-title">Title</h3>
                <p class="text-[15px] text-ios-subtext dark:text-gray-300 leading-snug font-medium" id="modal-message">Message details go here.</p>
                <input type="text" id="modal-input" class="hidden w-full mt-6 bg-black/5 dark:bg-white/10 border-none rounded-2xl px-5 py-4 text-[16px] font-semibold text-ios-text dark:text-white outline-none focus:ring-2 focus:ring-ios-blue transition-all placeholder-gray-400" placeholder="Enter name">
                
                <div id="modal-templates" class="hidden grid-cols-2 gap-3 mt-6">
                    <button onclick="addBlankPage('blank')" class="p-5 bg-white/50 dark:bg-white/5 border border-black/5 dark:border-white/5 rounded-2xl hover:bg-black/5 dark:hover:bg-white/10 font-bold text-[14px] flex flex-col items-center transition-all spring-btn text-ios-text dark:text-white"><i data-lucide="file" class="w-7 h-7 mb-3 text-ios-blue"></i>Blank</button>
                    <button onclick="addBlankPage('ruled')" class="p-5 bg-ios-blue/10 dark:bg-ios-darkBlue/20 border border-ios-blue/20 rounded-2xl hover:bg-ios-blue/20 font-bold text-[14px] flex flex-col items-center transition-all spring-btn text-ios-blue"><i data-lucide="align-justify" class="w-7 h-7 mb-3"></i>Ruled</button>
                    <button onclick="addBlankPage('grid')" class="p-5 bg-white/50 dark:bg-white/5 border border-black/5 dark:border-white/5 rounded-2xl hover:bg-black/5 dark:hover:bg-white/10 font-bold text-[14px] flex flex-col items-center transition-all spring-btn text-ios-text dark:text-white"><i data-lucide="grid" class="w-7 h-7 mb-3 text-ios-blue"></i>Grid</button>
                    <button onclick="addBlankPage('dotted')" class="p-5 bg-white/50 dark:bg-white/5 border border-black/5 dark:border-white/5 rounded-2xl hover:bg-black/5 dark:hover:bg-white/10 font-bold text-[14px] flex flex-col items-center transition-all spring-btn text-ios-text dark:text-white"><i data-lucide="more-horizontal" class="w-7 h-7 mb-3 text-ios-blue"></i>Dotted</button>
                </div>
            </div>
            <div id="modal-actions" class="flex border-t border-black/10 dark:border-white/10 bg-white/30 dark:bg-white/5">
                <button onclick="closeModal()" class="flex-1 py-5 text-ios-blue dark:text-ios-darkBlue font-semibold hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-[17px] tracking-wide active:opacity-70">Cancel</button>
                <div class="w-px bg-black/10 dark:bg-white/10"></div>
                <button id="modal-confirm-btn" class="flex-1 py-5 font-bold transition-colors text-[17px] tracking-wide active:opacity-70">Confirm</button>
            </div>
        </div>
    </div>

    <!-- GESTURE FEEDBACK TOAST -->
    <div id="gesture-toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-[2000] liquid-glass px-6 py-3 rounded-full opacity-0 pointer-events-none transition-all duration-300 scale-90 flex items-center shadow-2xl">
        <i id="toast-icon" data-lucide="info" class="w-5 h-5 mr-3 text-ios-text dark:text-white"></i>
        <span id="toast-text" class="text-[16px] font-extrabold tracking-tight text-ios-text dark:text-white">Action</span>
    </div>

    <!-- HIDDEN INPUTS -->
    <input type="color" id="native-color-picker" class="hidden">
    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageInsert(event)">

    <div id="app" class="flex h-screen w-full relative overflow-hidden bg-ios-bg dark:bg-ios-darkBg">
        
        <!-- ==================== LIBRARY VIEW ==================== -->
        <div id="library-view" class="flex h-full w-full absolute inset-0 z-40 spatial-transition transform-gpu">
            
            <!-- Library Sidebar -->
            <div class="w-[300px] liquid-glass-heavy border-r border-black/5 dark:border-white/10 flex flex-col h-full shrink-0 z-30 pt-16 shadow-2xl">
                <div class="px-8 pb-8">
                    <div class="flex items-center mb-10">
                        <div class="w-14 h-14 mr-4 shadow-[0_8px_16px_rgba(0,122,255,0.3)] rounded-[14px] overflow-hidden border border-white/40 dark:border-white/10 relative group perspective-[1000px] flex-shrink-0">
                            <!-- Premium Inline SVG Logo -->
                            <svg class="w-full h-full transform group-hover:scale-105 transition-transform duration-500 ease-out" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#32ADE6" />
                                        <stop offset="100%" stop-color="#007AFF" />
                                    </linearGradient>
                                    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
                                        <stop offset="100%" stop-color="rgba(255,255,255,0.2)" />
                                    </linearGradient>
                                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                                        <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
                                    </filter>
                                </defs>
                                <rect width="512" height="512" fill="url(#bgGrad)" />
                                <rect x="120" y="90" width="272" height="332" rx="24" fill="#ffffff" filter="url(#dropShadow)" />
                                <rect x="120" y="90" width="48" height="332" rx="24" fill="rgba(0,0,0,0.04)" />
                                <path d="M190 160 h160 M190 220 h160 M190 280 h160 M190 340 h100" stroke="#007AFF" stroke-width="8" stroke-linecap="round" opacity="0.3" />
                                <rect x="150" y="160" width="230" height="260" rx="32" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="4" filter="url(#dropShadow)" />
                                <path d="M266 210 l10 25 l25 10 l-25 10 l-10 25 l-10 -25 l-25 -10 l25 -10 z" fill="#FFD60A" filter="url(#dropShadow)"/>
                            </svg>
                        </div>
                        <h2 class="text-[26px] font-black tracking-tight text-ios-text dark:text-white">GreatNotes</h2>
                    </div>
                    <nav class="space-y-2.5 font-bold text-[16px]" id="library-nav">
                        <button onclick="setLibraryFilter('all')" id="nav-all" class="w-full flex items-center px-5 py-4 bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue rounded-2xl transition-all spring-btn"><i data-lucide="library" class="w-[22px] h-[22px] mr-4 stroke-[2.5]"></i> All Notes</button>
                        <button onclick="setLibraryFilter('favorites')" id="nav-favorites" class="w-full flex items-center px-5 py-4 text-ios-subtext hover:bg-black/5 dark:hover:bg-white/5 rounded-2xl transition-all spring-btn"><i data-lucide="star" class="w-[22px] h-[22px] mr-4 stroke-[2.5]"></i> Favorites</button>
                        <button onclick="setLibraryFilter('trash')" id="nav-trash" class="w-full flex items-center px-5 py-4 text-ios-subtext hover:bg-black/5 dark:hover:bg-white/5 rounded-2xl transition-all spring-btn"><i data-lucide="trash-2" class="w-[22px] h-[22px] mr-4 stroke-[2.5]"></i> Trash</button>
                    </nav>
                </div>
                <div class="mt-auto p-6 pb-12">
                    <button onclick="toggleTheme()" class="flex items-center text-[15px] font-bold text-ios-subtext hover:text-ios-text dark:hover:text-white transition-colors spring-btn w-full px-5 py-4 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5">
                        <i id="theme-icon" data-lucide="moon" class="w-5 h-5 mr-4 stroke-[2.5]"></i> Dark Mode
                    </button>
                </div>
            </div>

            <!-- Library Main Content -->
            <div class="flex-1 flex flex-col relative overflow-hidden bg-transparent">
                <div class="absolute top-10 left-10 right-10 z-30 flex justify-between items-center pointer-events-none">
                    <h1 class="text-[34px] font-black tracking-tight pointer-events-auto text-ios-text dark:text-white" id="library-title">All Notes</h1>
                    
                    <div class="flex items-center space-x-4 pointer-events-auto">
                        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden" onchange="handlePdfUpload(event)">
                        
                        <button onclick="document.getElementById('pdf-upload').click()" class="liquid-glass spring-btn flex items-center text-ios-text dark:text-white px-7 py-3.5 rounded-full font-bold transition-all text-[15px]">
                            <i data-lucide="file-up" class="w-5 h-5 mr-2.5 text-ios-blue stroke-[2.5]"></i> Import PDF
                        </button>
                        
                        <button onclick="requestNewNotebook()" class="liquid-glass spring-btn bg-ios-blue/90 dark:bg-ios-blue/90 text-white border-transparent px-7 py-3.5 rounded-full font-bold shadow-xl shadow-ios-blue/20 transition-all hover:bg-ios-blue text-[15px]">
                            <i data-lucide="plus" class="w-5 h-5 mr-2 stroke-[3]"></i> New
                        </button>
                    </div>
                </div>

                <div id="notebook-grid" class="flex-1 p-12 pt-40 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-12 gap-y-16 overflow-y-auto pb-32 perspective-[1200px]">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>

        <!-- ==================== DOCUMENT VIEW ==================== -->
        <div id="document-view" class="flex flex-col h-full w-full bg-ios-canvas dark:bg-ios-darkCanvas absolute inset-0 z-50 translate-y-full spatial-transition transform-gpu shadow-[0_-20px_60px_rgba(0,0,0,0.15)] dark:shadow-[0_-20px_60px_rgba(0,0,0,0.8)] rounded-t-[32px] sm:rounded-t-[40px] overflow-hidden">
            
            <!-- FLOATING TOP NAVIGATION -->
            <div class="absolute top-6 left-6 right-6 z-40 flex justify-between pointer-events-none">
                <!-- Left Nav -->
                <div class="liquid-glass spring-btn rounded-full p-2 flex items-center pointer-events-auto">
                    <button onclick="setView('library')" class="flex items-center text-ios-blue font-bold px-4 py-2 hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-colors tracking-wide text-[16px]">
                        <i data-lucide="chevron-left" class="w-6 h-6 -ml-2 stroke-[3]"></i> Library
                    </button>
                    <div class="w-px h-6 bg-black/10 dark:bg-white/20 mx-2"></div>
                    <button onclick="toggleSidebar()" class="p-3 rounded-full text-ios-text dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors" title="Thumbnails">
                        <i data-lucide="layout-grid" class="w-[20px] h-[20px] stroke-[2.5]"></i>
                    </button>
                </div>

                <!-- Center Title -->
                <div class="liquid-glass spring-btn rounded-full px-8 py-3 flex items-center pointer-events-auto cursor-pointer transition-transform group" onclick="requestRenameNotebook()">
                    <span id="doc-title" class="font-extrabold tracking-tight text-[17px] text-ios-text dark:text-white">Document</span>
                    <i data-lucide="edit-3" class="w-[18px] h-[18px] ml-3 text-ios-subtext group-hover:text-ios-blue transition-colors"></i>
                </div>

                <!-- Right Actions -->
                <div class="liquid-glass spring-btn rounded-full p-2 flex items-center pointer-events-auto space-x-1">
                    <div class="flex items-center bg-black/5 dark:bg-white/10 rounded-full px-1.5 py-1.5 mr-1">
                        <button onclick="adjustZoom(-0.25)" class="p-1.5 hover:bg-white dark:hover:bg-white/20 rounded-full text-ios-text dark:text-white transition-colors spring-btn"><i data-lucide="minus" class="w-4 h-4 stroke-[3]"></i></button>
                        <span id="zoom-text" class="text-[14px] font-bold w-[52px] text-center select-none text-ios-text dark:text-white">100%</span>
                        <button onclick="adjustZoom(0.25)" class="p-1.5 hover:bg-white dark:hover:bg-white/20 rounded-full text-ios-text dark:text-white transition-colors spring-btn"><i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i></button>
                    </div>
                    
                    <button onclick="document.getElementById('image-upload').click()" class="p-3 rounded-full text-ios-text dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors spring-btn" title="Insert Image">
                        <i data-lucide="image" class="w-[20px] h-[20px] stroke-[2.5]"></i>
                    </button>
                    <button onclick="toggleFullscreen()" class="p-3 rounded-full text-ios-text dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors spring-btn" title="Fullscreen">
                        <i id="fullscreen-icon" data-lucide="maximize" class="w-[20px] h-[20px] stroke-[2.5]"></i>
                    </button>
                    <button onclick="requestAddPage()" class="p-3 rounded-full text-ios-text dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors spring-btn" title="Add Page">
                        <i data-lucide="file-plus" class="w-[20px] h-[20px] stroke-[2.5]"></i>
                    </button>
                    <button onclick="exportToPDF()" class="p-3 rounded-full text-ios-text dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors spring-btn" title="Export PDF">
                        <i data-lucide="share" class="w-[20px] h-[20px] stroke-[2.5]"></i>
                    </button>
                </div>
            </div>

            <!-- FLOATING DRAWING TOOLBAR (Apple PencilKit Style) -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-40 pointer-events-none pb-[env(safe-area-inset-bottom)]" id="drawing-toolbar">
                <div class="liquid-glass rounded-[40px] p-2.5 flex items-center pointer-events-auto space-x-3 shadow-2xl transition-all duration-300">
                    
                    <!-- Stylus Mode -->
                    <button id="btn-stylus-mode" onclick="toggleStylusMode()" class="p-4 rounded-full transition-colors spring-btn" title="Apple Pencil Only Mode">
                        <i data-lucide="pen-line" class="w-[22px] h-[22px] stroke-[2.5]"></i>
                    </button>
                    <div class="w-px h-10 bg-black/10 dark:bg-white/20 mx-1"></div>

                    <!-- Main Tools -->
                    <div class="flex space-x-2 bg-black/5 dark:bg-white/10 p-2 rounded-[32px]">
                        <button onclick="setTool('pan')" id="tool-pan" class="tool-btn p-3.5 w-[56px] flex justify-center rounded-[24px] spring-btn text-gray-500" title="Pan / Read-Only Mode">
                            <i data-lucide="hand" class="w-6 h-6 stroke-[2]"></i>

                        </button>
                        <button onclick="requestClearCurrentPage()" class="p-4 rounded-full text-red-500 hover:bg-red-50 dark:hover:bg-red-500/20 transition-colors spring-btn ml-1" title="Clear Page">
                            <i data-lucide="trash-2" class="w-[22px] h-[22px] stroke-[2.5]"></i>

            </div>

            <!-- Workspace Body -->
            <div class="flex flex-1 overflow-hidden relative rounded-t-[32px] sm:rounded-t-[40px]"> 
                
                <!-- Slide-over Sidebar Thumbnails -->
                <div id="sidebar" class="absolute top-0 bottom-0 left-0 w-[320px] bg-white/95 dark:bg-[#1C1C1E]/95 backdrop-blur-3xl border-r border-black/5 dark:border-white/10 flex flex-col z-30 transform transition-transform duration-500 ease-out shadow-2xl pt-[100px]">
                    <div class="flex items-center justify-between px-8 py-5 border-b border-black/5 dark:border-white/10">
                        <span class="font-extrabold text-[13px] uppercase tracking-widest text-ios-subtext">Document Pages</span>
                        <button onclick="toggleSidebar()" class="p-2 bg-black/5 dark:bg-white/10 rounded-full text-ios-text dark:text-white hover:bg-black/10 transition-colors spring-btn"><i data-lucide="x" class="w-4 h-4 stroke-[3]"></i></button>
                    </div>
                    <div id="sidebar-thumbnails" class="flex-1 overflow-y-auto p-8 space-y-10 scrollbar-hide">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Floating Page Indicator -->
                <div id="page-indicator" class="absolute bottom-8 right-8 z-40 liquid-glass rounded-full px-6 py-3 font-bold text-[15px] text-ios-text dark:text-white pointer-events-none transition-opacity duration-300 opacity-0 tracking-wide shadow-xl">
                    Page 1 of 1
                </div>

                <!-- Scrollable Viewport -->
                <div id="canvas-viewport" class="flex-1 overflow-y-auto overflow-x-auto relative flex justify-center w-full pt-[110px]">
                    <div id="zoom-wrapper" class="flex flex-col items-center py-6 space-y-16 min-w-full pb-64"> 
                        <!-- Pages Populated Here -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Libraries ---
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const { jsPDF } = window.jspdf;

        // --- Premium Configurations ---
        const PALETTES = {
            pen: ['#1C1C1E', '#0A84FF', '#FF375F', '#30D158'], 
            highlighter: ['#FFD60A', '#32ADE6', '#FF375F', '#30D158'] 
        };
        const SIZES = { pen: [2, 5, 9], highlighter: [18, 32, 48], eraser: [20, 50, 80] };
        
        const COVERS = [
            'linear-gradient(135deg, #0A84FF 0%, #004494 100%)', 
            'linear-gradient(135deg, #FF375F 0%, #a81c14 100%)', 
            'linear-gradient(135deg, #30D158 0%, #1c7a33 100%)', 
            'linear-gradient(135deg, #1C1C1E 0%, #4a4a4d 100%)', 
            'linear-gradient(135deg, #5E5CE6 0%, #3a388e 100%)', 
            'linear-gradient(135deg, #FF9F0A 0%, #b36f06 100%)', 
        ];

        const PAGE_WIDTH = 840; 

        // --- Application State ---
        let isDarkMode = false;
        let view = 'library';
        let libraryFilter = 'all'; 
        let notebooks = [];
        let activeTabId = null;
        let sidebarOpen = false; 
        let activePageIndex = 0; 
        
        let stylusOnlyMode = true; 
        let zoomLevel = 1.0; 

        let currentTool = 'pen'; 
        let activeColor = PALETTES.pen[0];
        let activeSize = SIZES.pen[1];

        // --- Virtualization & Memory ---
        // GAME CHANGER: Stores PDF objects directly in RAM instead of millions of Base64 pixels
        const pdfDocumentCache = new Map();
        let renderedPages = new Set();
        let canvasObserver = null;
        let scrollThumbTimeout = null;

        // --- Drawing Engine State ---
        let isDrawing = false;
        let currentActiveCanvas = null; 
        let currentDrawingCanvas = null; 
        let activePageIndexForDrawing = null;
        let strokePoints = []; 
        let lastPressure = 0.5;
        let lastPoint = null;

        // --- Gesture Variables ---
        let touchStartFingers = 0;
        let touchStartTime = 0;
        let gestureHandled = false;
        let toastTimeout;
        let indicatorTimeout;

        // --- Boot Sequence ---
        function init() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDarkMode = true;
                document.documentElement.classList.add('dark');
            }
            lucide.createIcons();
            if(isDarkMode) document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');

            setupPWA(); 

            // Default Mock Data
            notebooks.push({
                id: 'nb_1', title: 'Machine Learning', cover: COVERS[0], isFavorite: true, isTrashed: false,
                pages: [{ id: 'p1', paths: [], redoPaths: [], paperType: 'grid', bgImage: null, width: PAGE_WIDTH, height: 1100 }]
            });
            notebooks.push({
                id: 'nb_2', title: 'Daily Journal', cover: COVERS[3], isFavorite: false, isTrashed: false,
                pages: [{ id: 'p1', paths: [], redoPaths: [], paperType: 'ruled', bgImage: null, width: PAGE_WIDTH, height: 1100 }]
            });
            
            renderLibrary();
            setTool('pen');
            updateStylusModeUI();
            setupPinchToZoom();
            setupColorPicker();
            
            // Native Smooth Scrolling Tracker
            document.getElementById('canvas-viewport').addEventListener('scroll', () => {
                if (view !== 'document') return;
                
                updatePageIndicatorUI();
                
                clearTimeout(scrollThumbTimeout);
                scrollThumbTimeout = setTimeout(() => {
                    const curr = getCurrentPageIndex();
                    if (curr !== activePageIndex) {
                        activePageIndex = curr;
                        highlightThumbnail(curr);
                        updatePageIndicatorUI();
                        updateUndoRedoUI();
                    }
                }, 100);
            }, { passive: true });
            
            document.addEventListener('fullscreenchange', () => {
                const icon = document.getElementById('fullscreen-icon');
                if (icon) {
                    icon.setAttribute('data-lucide', document.fullscreenElement ? 'minimize' : 'maximize');
                    lucide.createIcons();
                }
            });

            document.getElementById('document-view').style.transform = 'translateY(100%)';
            document.getElementById('sidebar').style.transform = 'translateX(-100%)';
            setView('library'); 
        }

        // --- View Tracking Utility ---
        function getCurrentPageIndex() {
            const viewport = document.getElementById('canvas-viewport');
            const wrappers = document.querySelectorAll('.page-wrapper');
            if (!wrappers || wrappers.length === 0) return 0;
            
            let closestIndex = 0;
            let minDistance = Infinity;
            
            const viewportRect = viewport.getBoundingClientRect();
            const viewportCenterY = viewportRect.top + (viewportRect.height / 2);

            wrappers.forEach((wrapper, index) => {
                const rect = wrapper.getBoundingClientRect();
                const wrapperCenterY = rect.top + (rect.height / 2);
                const distance = Math.abs(viewportCenterY - wrapperCenterY);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            
            return closestIndex;
        }

        function updatePageIndicatorUI() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            const currentIndex = getCurrentPageIndex();
            const indicator = document.getElementById('page-indicator');
            
            indicator.innerText = `Page ${currentIndex + 1} of ${nb.pages.length}`;
            indicator.classList.remove('opacity-0');
            indicator.classList.add('opacity-100');
            
            clearTimeout(indicatorTimeout);
            indicatorTimeout = setTimeout(() => {
                indicator.classList.remove('opacity-100');
                indicator.classList.add('opacity-0');
            }, 1800);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // --- PWA & Native App Setup ---
        function setupPWA() {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#32ADE6" /><stop offset="100%" stop-color="#007AFF" /></linearGradient><linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(255,255,255,0.9)" /><stop offset="100%" stop-color="rgba(255,255,255,0.2)" /></linearGradient><filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/></filter></defs><rect width="512" height="512" fill="url(#bgGrad)" /><rect x="120" y="90" width="272" height="332" rx="24" fill="#ffffff" filter="url(#dropShadow)" /><rect x="120" y="90" width="48" height="332" rx="24" fill="rgba(0,0,0,0.04)" /><path d="M190 160 h160 M190 220 h160 M190 280 h160 M190 340 h100" stroke="#007AFF" stroke-width="8" stroke-linecap="round" opacity="0.3" /><rect x="150" y="160" width="230" height="260" rx="32" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="4" filter="url(#dropShadow)" /><path d="M266 210 l10 25 l25 10 l-25 10 l-10 25 l-10 -25 l-25 -10 l25 -10 z" fill="#FFD60A" filter="url(#dropShadow)"/></svg>`;
            const encodedIcon = 'data:image/svg+xml;base64,' + btoa(svgIcon);
            
            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = encodedIcon;
            document.head.appendChild(appleIcon);

            const favicon = document.createElement('link');
            favicon.rel = 'icon';
            favicon.type = 'image/svg+xml';
            favicon.href = encodedIcon;
            document.head.appendChild(favicon);

            const manifest = {
                name: "GreatNotes",
                short_name: "GreatNotes",
                display: "standalone",
                background_color: "#F2F2F7",
                theme_color: "#0A84FF",
                icons: [{ src: encodedIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
            };
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.appendChild(manifestLink);
        }

        function setupPinchToZoom() {
            const viewport = document.getElementById('canvas-viewport');
            let initialZoom = 1.0;

            viewport.addEventListener('gesturestart', (e) => {
                e.preventDefault();
                initialZoom = zoomLevel;
            });

            viewport.addEventListener('gesturechange', (e) => {
                e.preventDefault();
                let newZoom = initialZoom * e.scale;
                newZoom = Math.max(0.5, Math.min(newZoom, 4.0));
                setZoom(newZoom);
            });

            viewport.addEventListener('gestureend', (e) => { e.preventDefault(); });
        }

        // --- Theme Engine ---
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
            updateToolbar(); 
            if(activeTabId) highlightThumbnail(activePageIndex); 
        }

        // --- Modals & Toasts ---
        function showToast(text, icon = 'info') {
            const toast = document.getElementById('gesture-toast');
            document.getElementById('toast-text').innerText = text;
            document.getElementById('toast-icon').setAttribute('data-lucide', icon);
            lucide.createIcons();
            
            toast.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
            toast.classList.add('opacity-100', 'scale-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }, 1200);
        }

        function showModal(title, message, confirmText, isDestructive, onConfirm, showInput = false, defaultInput = "", showTemplates = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const inputField = document.getElementById('modal-input');
            if (showInput) {
                inputField.classList.remove('hidden');
                inputField.value = defaultInput;
                setTimeout(() => inputField.focus(), 300); 
            } else {
                inputField.classList.add('hidden');
            }

            const confirmBtn = document.getElementById('modal-confirm-btn');
            const templateGrid = document.getElementById('modal-templates');
            const actionsArea = document.getElementById('modal-actions');

            if (showTemplates) {
                templateGrid.classList.remove('hidden');
                templateGrid.classList.add('grid');
                actionsArea.classList.add('hidden'); 
            } else {
                templateGrid.classList.add('hidden');
                templateGrid.classList.remove('grid');
                actionsArea.classList.remove('hidden');
            }

            confirmBtn.innerText = confirmText;
            
            if (isDestructive) {
                confirmBtn.className = 'flex-1 py-5 font-bold transition-colors text-[17px] text-red-500 hover:bg-black/5 dark:hover:bg-white/5 active:opacity-70';
            } else {
                confirmBtn.className = 'flex-1 py-5 font-bold transition-colors text-[17px] text-ios-blue dark:text-ios-darkBlue hover:bg-black/5 dark:hover:bg-white/5 active:opacity-70';
            }
            
            confirmBtn.onclick = () => {
                if(showInput) onConfirm(inputField.value);
                else onConfirm();
                closeModal();
            };

            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            modal.classList.add('active');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            setTimeout(() => { modal.classList.remove('active'); }, 300);
        }

        function showLoading(text, subtext) {
            const overlay = document.getElementById('loading-overlay');
            const content = document.getElementById('loading-content');
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-subtext').innerText = subtext;
            overlay.classList.add('active');
            setTimeout(() => {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }, 10);
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            const content = document.getElementById('loading-content');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            setTimeout(() => { overlay.classList.remove('active'); }, 300);
        }

        // --- Navigation (SPATIAL TRANSITION UPDATE) ---
        function setView(newView) {
            view = newView;
            const libView = document.getElementById('library-view');
            const docView = document.getElementById('document-view');

            if (view === 'library') {
                libView.style.transform = 'translateY(0) scale(1)';
                libView.style.filter = 'blur(0px)';
                libView.style.opacity = '1';
                
                docView.style.transform = 'translateY(100%)'; 
                
                renderLibrary();
                activeTabId = null;
                sidebarOpen = false;
                document.getElementById('sidebar').style.transform = 'translateX(-100%)';
            } else {
                libView.style.transform = 'translateY(-2%) scale(0.92)'; 
                libView.style.filter = 'blur(10px)';
                libView.style.opacity = '0.5';
                
                docView.style.transform = 'translateY(0)'; 
                
                setZoom(1.0);
                updateDocumentUI(); 
            }
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            if (sidebarOpen) sidebar.style.transform = 'translateX(0)';
            else sidebar.style.transform = 'translateX(-100%)';
        }

        // --- Library Logic ---
        function setLibraryFilter(filter) {
            libraryFilter = filter;
            ['all', 'favorites', 'trash'].forEach(f => {
                const btn = document.getElementById(`nav-${f}`);
                if(f === filter) {
                    btn.classList.add('bg-ios-blue/10', 'dark:bg-ios-blue/20', 'text-ios-blue');
                    btn.classList.remove('text-ios-subtext', 'hover:bg-black/5', 'dark:hover:bg-white/5');
                } else {
                    btn.classList.remove('bg-ios-blue/10', 'dark:bg-ios-blue/20', 'text-ios-blue');
                    btn.classList.add('text-ios-subtext', 'hover:bg-black/5', 'dark:hover:bg-white/5');
                }
            });

            const titleObj = { 'all': 'All Notes', 'favorites': 'Favorites', 'trash': 'Trash' };
            document.getElementById('library-title').innerText = titleObj[filter];
            renderLibrary();
        }

        function renderLibrary() {
            const grid = document.getElementById('notebook-grid');
            grid.innerHTML = '';
            
            let filteredNbs = notebooks;
            if (libraryFilter === 'favorites') filteredNbs = notebooks.filter(n => n.isFavorite && !n.isTrashed);
            else if (libraryFilter === 'trash') filteredNbs = notebooks.filter(n => n.isTrashed);
            else filteredNbs = notebooks.filter(n => !n.isTrashed);

            if(filteredNbs.length === 0) {
                grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center pt-32 text-ios-subtext opacity-50"><i data-lucide="${libraryFilter==='trash'?'trash-2':'book-x'}" class="w-24 h-24 mb-6 stroke-[1.5]"></i><p class="text-2xl font-bold">Nothing here</p></div>`;
                lucide.createIcons();
                return;
            }

            filteredNbs.forEach(nb => {
                const item = document.createElement('div');
                item.className = 'flex flex-col items-center cursor-pointer group relative spring-btn';
                if (!nb.isTrashed) item.onclick = () => openNotebook(nb.id);

                let hoverActions = '';
                if (nb.isTrashed) {
                    hoverActions = `
                        <button onclick="event.stopPropagation(); restoreNotebook('${nb.id}')" class="bg-white/95 dark:bg-black/90 p-4 rounded-full text-ios-blue hover:scale-110 transition-transform shadow-xl"><i data-lucide="rotate-ccw" class="w-[24px] h-[24px] stroke-[2.5]"></i></button>
                        <button onclick="event.stopPropagation(); requestDeleteNotebook('${nb.id}', '${nb.title}')" class="bg-white/95 dark:bg-black/90 p-4 rounded-full text-red-500 hover:scale-110 transition-transform shadow-xl"><i data-lucide="trash-2" class="w-[24px] h-[24px] stroke-[2.5]"></i></button>
                    `;
                } else {
                    hoverActions = `
                        <button onclick="event.stopPropagation(); toggleFavorite('${nb.id}')" class="bg-white/95 dark:bg-black/90 p-4 rounded-full ${nb.isFavorite ? 'text-yellow-500' : 'text-ios-text dark:text-white'} hover:scale-110 transition-transform shadow-xl"><i data-lucide="star" class="${nb.isFavorite ? 'fill-yellow-500' : ''} w-[24px] h-[24px] stroke-[2.5]"></i></button>
                        <button onclick="event.stopPropagation(); moveToTrash('${nb.id}')" class="bg-white/95 dark:bg-black/90 p-4 rounded-full text-red-500 hover:scale-110 transition-transform shadow-xl"><i data-lucide="trash-2" class="w-[24px] h-[24px] stroke-[2.5]"></i></button>
                    `;
                }

                const bookUI = document.createElement('div');
                bookUI.className = 'w-full aspect-[3/4] book-cover rounded-r-[24px] rounded-l-[8px] shadow-page dark:shadow-page-dark flex items-center justify-center relative overflow-hidden ring-1 ring-black/5 dark:ring-white/10';
                bookUI.style.background = nb.cover;
                bookUI.innerHTML = `
                    <div class="book-spine"></div>
                    <div class="bg-white/95 dark:bg-[#1C1C1E]/95 px-5 py-4 rounded-[14px] shadow-glass dark:shadow-glass-dark w-[82%] text-center font-extrabold text-[16px] text-ios-text dark:text-white overflow-hidden backdrop-blur-xl z-10 border border-white/60 dark:border-white/10">
                        <span class="truncate block w-full tracking-tight">${nb.title}</span>
                    </div>
                    <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20 flex items-center justify-center space-x-5 backdrop-blur-[2px]">
                        ${hoverActions}
                    </div>
                `;

                const labelUI = document.createElement('div');
                labelUI.className = 'mt-7 text-center px-2 w-full';
                labelUI.innerHTML = `
                    <span class="block text-[17px] font-bold truncate w-full tracking-tight text-ios-text dark:text-white flex items-center justify-center">
                        ${nb.isFavorite ? '<i data-lucide="star" class="w-4 h-4 fill-yellow-500 text-yellow-500 mr-2"></i>' : ''} ${nb.title}
                    </span>
                    <span class="text-[14px] font-bold text-ios-subtext dark:text-ios-darkSubtext mt-1.5 block">${nb.pages.length} Page${nb.pages.length !== 1 ? 's' : ''}</span>
                `;

                item.appendChild(bookUI);
                item.appendChild(labelUI);
                grid.appendChild(item);
            });
            lucide.createIcons();
        }

        function toggleFavorite(id) {
            const nb = notebooks.find(n => n.id === id);
            if(nb) nb.isFavorite = !nb.isFavorite;
            renderLibrary();
        }

        function moveToTrash(id) {
            const nb = notebooks.find(n => n.id === id);
            if(nb) nb.isTrashed = true;
            renderLibrary();
        }

        function restoreNotebook(id) {
            const nb = notebooks.find(n => n.id === id);
            if(nb) nb.isTrashed = false;
            renderLibrary();
        }

        // --- Document Logic ---
        function requestNewNotebook() {
            showModal("New Notebook", "Name your masterpiece:", "Create", false, (name) => {
                const title = name.trim() || 'Untitled Note';
                const nbId = Date.now().toString();
                notebooks.unshift({ 
                    id: nbId, title: title, cover: COVERS[Math.floor(Math.random() * COVERS.length)],
                    isFavorite: false, isTrashed: false,
                    pages: [{ id: `p_${Date.now()}`, paths: [], redoPaths: [], paperType: 'ruled', bgImage: null, width: PAGE_WIDTH, height: 1100 }]
                });
                setLibraryFilter('all');
                openNotebook(nbId);
            }, true, "");
        }

        function requestRenameNotebook() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if(!nb) return;
            showModal("Rename Notebook", "Enter a new name:", "Save", false, (newName) => {
                const title = newName.trim();
                if(title) {
                    nb.title = title;
                    document.getElementById('doc-title').innerText = title;
                }
            }, true, nb.title);
        }

        function openNotebook(id) {
            activeTabId = id;
            setView('document'); 
        }

        function requestDeleteNotebook(id, title) {
            showModal("Delete Permanently", `Are you sure you want to permanently delete "${title}"? This cannot be undone.`, "Delete", true, () => {
                notebooks = notebooks.filter(n => n.id !== id);
                if (activeTabId === id) setView('library');
                else renderLibrary();
            });
        }

        function requestDeletePage(pageIndex) {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb || nb.pages.length <= 1) {
                showModal("Cannot Delete", "A notebook requires at least one page.", "OK", false, ()=>{});
                return;
            }
            showModal("Delete Page", `Remove Page ${pageIndex + 1} permanently?`, "Delete", true, () => {
                nb.pages.splice(pageIndex, 1);
                activePageIndex = Math.max(0, Math.min(pageIndex, nb.pages.length - 1));
                updateDocumentUI();
                
                setTimeout(() => {
                    const wrapper = document.getElementById(`page-wrapper-${activePageIndex}`);
                    if (wrapper) wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            });
        }

        function requestClearCurrentPage() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            
            const currentIndex = getCurrentPageIndex();
            if (nb.pages[currentIndex].paths.length === 0) return; 

            showModal("Clear Page", `Erase all content from Page ${currentIndex + 1}?`, "Erase", true, () => {
                nb.pages[currentIndex].paths = []; 
                nb.pages[currentIndex].redoPaths = [];
                if (renderedPages.has(currentIndex)) redrawPage(currentIndex);
                updateUndoRedoUI();
            });
        }

        function requestAddPage() {
            showModal("Add Page", "Select a template to insert after the current page:", "Add", false, () => {}, false, "", true);
            lucide.createIcons();
        }

        function addBlankPage(type = 'ruled') {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            
            const currentIndex = getCurrentPageIndex();
            const insertIndex = currentIndex + 1;
            const refPage = nb.pages[currentIndex];
            
            nb.pages.splice(insertIndex, 0, { 
                id: `p_${Date.now()}`, paths: [], redoPaths: [], paperType: type, bgImage: null, 
                width: refPage ? refPage.width : PAGE_WIDTH, height: refPage ? refPage.height : 1100 
            });
            
            activePageIndex = insertIndex;
            updateDocumentUI();

            setTimeout(() => {
                const wrapper = document.getElementById(`page-wrapper-${insertIndex}`);
                if (wrapper) {
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    highlightThumbnail(insertIndex);
                }
            }, 100);

            closeModal();
        }

        // --- Undo / Redo Engine ---
        function updateUndoRedoUI() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            const page = nb.pages[getCurrentPageIndex()];
            
            const btnUndo = document.getElementById('btn-undo');
            const btnRedo = document.getElementById('btn-redo');

            if (page && page.paths.length > 0) {
                btnUndo.classList.remove('opacity-50');
                btnUndo.removeAttribute('disabled');
            } else {
                btnUndo.classList.add('opacity-50');
                btnUndo.setAttribute('disabled', 'true');
            }

            if (page && page.redoPaths && page.redoPaths.length > 0) {
                btnRedo.classList.remove('opacity-50');
                btnRedo.removeAttribute('disabled');
            } else {
                btnRedo.classList.add('opacity-50');
                btnRedo.setAttribute('disabled', 'true');
            }
        }

        function undoLastStroke() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            
            const currentIndex = getCurrentPageIndex();
            const page = nb.pages[currentIndex];
            
            if (page && page.paths.length > 0) {
                const undonePath = page.paths.pop(); 
                if(!page.redoPaths) page.redoPaths = [];
                page.redoPaths.push(undonePath);
                if (renderedPages.has(currentIndex)) redrawPage(currentIndex);
                showToast("Undo", "undo-2");
                updateUndoRedoUI();
            }
        }

        function redoLastStroke() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            
            const currentIndex = getCurrentPageIndex();
            const page = nb.pages[currentIndex];
            
            if (page && page.redoPaths && page.redoPaths.length > 0) {
                const redonePath = page.redoPaths.pop();
                page.paths.push(redonePath);
                if (renderedPages.has(currentIndex)) redrawPage(currentIndex);
                showToast("Redo", "redo-2");
                updateUndoRedoUI();
            }
        }

        // --- Stylus & Touch Logic ---
        function toggleStylusMode() {
            stylusOnlyMode = !stylusOnlyMode;
            updateStylusModeUI();
        }

        function updateStylusModeUI() {
            const btn = document.getElementById('btn-stylus-mode');
            if (stylusOnlyMode) {
                btn.className = 'p-4 rounded-full transition-colors spring-btn bg-ios-blue text-white shadow-xl shadow-ios-blue/30';
            } else {
                btn.className = 'p-4 rounded-full transition-colors spring-btn bg-black/5 dark:bg-white/10 text-ios-text dark:text-white hover:bg-black/10 dark:hover:bg-white/20';
            }
        }

        function preventScrollIfDrawing(e) {
            if (currentTool === 'pan') return; 
            if (e.touches && e.touches.length >= 2) return; 
            if (stylusOnlyMode) {
                if (e.touches) {
                    let isFinger = Array.from(e.touches).some(t => t.touchType !== 'stylus');
                    if (isFinger) return;
                }
            }
            if(e.cancelable) e.preventDefault(); 
        }

        function adjustZoom(delta) {
            let newZoom = zoomLevel + delta;
            newZoom = Math.max(0.5, Math.min(newZoom, 4.0)); 
            setZoom(newZoom);
        }

        function setZoom(level) {
            zoomLevel = level;
            document.getElementById('zoom-text').innerText = `${Math.round(zoomLevel * 100)}%`;
            
            const nb = notebooks.find(n => n.id === activeTabId);
            if (!nb) return;
            
            nb.pages.forEach((page, index) => {
                const wrapper = document.getElementById(`page-wrapper-${index}`);
                if (wrapper) {
                    wrapper.style.width = `${page.width * zoomLevel}px`;
                    wrapper.style.height = `${page.height * zoomLevel}px`;
                }
            });
        }

        // --- Toolbar UI Updates ---
        function setTool(tool) {
            currentTool = tool;
            
            if (['pen', 'line', 'laser'].includes(tool)) {
                if (!PALETTES.pen.includes(activeColor)) activeColor = PALETTES.pen[0];
                if (!SIZES.pen.includes(activeSize)) activeSize = SIZES.pen[1];
            } else if (tool === 'highlighter') {
                if (!PALETTES.highlighter.includes(activeColor)) activeColor = PALETTES.highlighter[0];
                if (!SIZES.highlighter.includes(activeSize)) activeSize = SIZES.highlighter[1];
            } else if (tool === 'eraser') {
                activeSize = SIZES.eraser[1];
            }
            updateToolbar();
            document.querySelectorAll('[id^="active-canvas-"]').forEach(canvas => {
                if (tool === 'eraser') canvas.style.cursor = 'cell';
                else if (tool === 'pan') canvas.style.cursor = 'grab';
                else canvas.style.cursor = 'crosshair';
            });
        }

        function setupColorPicker() {
            const picker = document.getElementById('native-color-picker');
            picker.addEventListener('input', (e) => {
                activeColor = e.target.value;
                if (['pen', 'line', 'laser'].includes(currentTool)) {
                    if (!PALETTES.pen.includes(activeColor)) {
                        if (PALETTES.pen.length >= 5) PALETTES.pen.pop();
                        PALETTES.pen.unshift(activeColor); 
                    }
                } else if (currentTool === 'highlighter') {
                    if (!PALETTES.highlighter.includes(activeColor)) {
                        if (PALETTES.highlighter.length >= 5) PALETTES.highlighter.pop();
                        PALETTES.highlighter.unshift(activeColor);
                    }
                }
                updateToolbar();
            });
        }

        function updateToolbar() {
            ['pan', 'pen', 'highlighter', 'line', 'eraser', 'laser'].forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if (!btn) return;
                const icon = btn.querySelector('svg') || btn.querySelector('i');
                if (t === currentTool) {
                    btn.classList.add('active', 'text-ios-blue', 'bg-white', 'dark:bg-white/20', 'shadow-md');
                    btn.classList.remove('text-gray-500');
                    if(icon) icon.classList.replace('stroke-[2]', 'stroke-[2.5]');
                } else {
                    btn.classList.remove('active', 'text-ios-blue', 'bg-white', 'dark:bg-white/20', 'shadow-md');
                    btn.classList.add('text-gray-500', 'hover:bg-black/5', 'dark:hover:bg-white/10');
                    if(icon) icon.classList.replace('stroke-[2.5]', 'stroke-[2]');
                }
            });

            const configAreas = document.querySelectorAll('.tool-config-area');
            if (currentTool === 'pan') {
                configAreas.forEach(a => { a.style.opacity = '0.3'; a.style.pointerEvents = 'none'; });
                return;
            } else {
                configAreas.forEach(a => { a.style.opacity = '1'; a.style.pointerEvents = 'auto'; });
            }

            const colorContainer = document.getElementById('color-palette');
            colorContainer.innerHTML = '';
            
            if (currentTool !== 'eraser' && currentTool !== 'pan') {
                const colors = currentTool === 'highlighter' ? PALETTES.highlighter : PALETTES.pen;
                colors.forEach(color => {
                    const btn = document.createElement('button');
                    btn.onclick = () => { activeColor = color; updateToolbar(); };
                    
                    const ringColor = isDarkMode ? 'outline-white border-black/50' : 'outline-ios-blue border-white';
                    const activeClasses = `scale-[1.25] shadow-lg border-[3px] outline outline-2 outline-offset-2 ${ringColor}`;
                    const inactiveClasses = isDarkMode ? 'border border-white/20' : 'border border-black/10';
                    
                    btn.className = `color-btn w-[32px] h-[32px] rounded-full transition-all duration-300 spring-btn flex-shrink-0 ${color === activeColor ? activeClasses : inactiveClasses}`;
                    btn.style.backgroundColor = color;
                    if(isDarkMode && color === '#1C1C1E') btn.style.border = '1px solid rgba(255,255,255,0.4)';
                    colorContainer.appendChild(btn);
                });

                const wheelBtn = document.createElement('button');
                wheelBtn.title = "Custom Color";
                wheelBtn.onclick = () => {
                    const picker = document.getElementById('native-color-picker');
                    picker.value = activeColor;
                    picker.click();
                };
                wheelBtn.className = `color-btn w-[32px] h-[32px] rounded-full transition-all duration-300 spring-btn flex-shrink-0 border border-white/20 shadow-inner ml-2 relative overflow-hidden`;
                wheelBtn.style.background = 'conic-gradient(from 90deg, red, yellow, lime, aqua, blue, magenta, red)';
                
                const innerRing = document.createElement('div');
                innerRing.className = 'absolute inset-[2px] rounded-full border border-black/20 dark:border-white/20 bg-white/10 mix-blend-overlay pointer-events-none';

                const inactiveClasses = isDarkMode ? 'hover:bg-white/10' : 'hover:bg-black/5 hover:scale-110';
                
                btn.className = `size-btn w-[46px] h-[46px] flex flex-shrink-0 items-center justify-center rounded-full transition-all spring-btn ${size === activeSize ? activeClasses : inactiveClasses}`;

                const dotColor = currentTool === 'eraser' 
                    ? (isDarkMode ? 'border border-gray-500 bg-transparent' : 'border border-gray-400 bg-white') 
                    : (isDarkMode ? 'bg-gray-200' : 'bg-gray-800');
                    
                btn.innerHTML = `<div class="rounded-full ${dotColor}" style="width: ${visualSize}px; height: ${visualSize}px"></div>`;

        // --- VIRTUALIZATION ENGINE (LAZY PDF LOADING OPTIMIZATION) ---
        function updateDocumentUI() {
            const nb = notebooks.find(n => n.id === activeTabId);
            if(nb) document.getElementById('doc-title').innerText = nb.title;
